name: Release (.NET)

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write  # needed to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true  # optional; requires lock files

      - name: Restore
        run: dotnet restore DemoGithubActions.sln

      - name: Build
        run: dotnet build DemoGithubActions.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DemoGithubActions.sln --configuration Release --no-build

      - name: Publish (linux-x64)
        run: dotnet publish HelloWorld/HelloWorld.csproj -c Release -r linux-x64 --self-contained false -o out/linux-x64

      - name: Publish (win-x64)
        run: dotnet publish HelloWorld/HelloWorld.csproj -c Release -r win-x64 --self-contained false -o out/win-x64

      - name: Publish (osx-arm64)
        run: dotnet publish HelloWorld/HelloWorld.csproj -c Release -r osx-arm64 --self-contained false -o out/osx-arm64

      - name: Archive binaries
        run: |
          cd out
          zip -r app-linux-x64.zip linux-x64
          zip -r app-win-x64.zip   win-x64
          zip -r app-osx-arm64.zip osx-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            out/app-linux-x64.zip
            out/app-win-x64.zip
            out/app-osx-arm64.zip
