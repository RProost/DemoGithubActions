name: CI (.NET)

on:
  push:
    branches: [ main ]
    paths:
      - 'HelloWorld/**'
      - 'HelloWorld.Tests/**'     # include your test project path
      - '.github/workflows/**'
      - 'DemoGithubActions.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.editorconfig'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'HelloWorld/**'
      - 'HelloWorld.Tests/**'     # include your test project path
      - '.github/workflows/**'
      - 'DemoGithubActions.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.editorconfig'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            global.json
            Directory.Build.props

      - name: Restore (solution)
        run: dotnet restore DemoGithubActions.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build DemoGithubActions.sln --configuration Release --no-restore /warnaserror

      - name: Test with coverage
        run: |
          dotnet test DemoGithubActions.sln --configuration Release --no-build \
            --collect "XPlat Code Coverage" \
            --logger "trx;LogFileName=test_results.trx"

      # ---- Coverage report using a repo-local tool manifest (recommended) ----
      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Report coverage (HTML + Cobertura)
        run: |
          dotnet tool run reportgenerator \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:"coverage" \
            -reporttypes:"HtmlInline;Cobertura"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Upload test results (TRX)
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

  formatting:
    name: Enforce dotnet format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Check formatting
        run: dotnet format --verify-no-changes
